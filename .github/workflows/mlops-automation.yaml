name: MLOps Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # (Catatan: DVC Pull dilewati pada simulasi CI/CD statis untuk menghindari error autentikasi DagsHub di GitHub Actions. 
    # File .csv berukuran kecil sudah diizinkan untuk diakses langsung demi memvalidasi pipeline CI/CD).

    - name: 4. Tahap 1 - Automated Testing (Pytest)
      run: |
        pytest tests/

    - name: 5. Tahap 2, 3, & 4 - Train, Evaluasi, & Auto-Registry
      run: |
        python src/process/train.py --n_estimators 200 --max_depth 15