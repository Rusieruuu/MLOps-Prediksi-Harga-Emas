services:
  mlflow-server:
    image: python:3.10
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - mlops_network
    command: >
      bash -c "pip install mlflow==2.9.2 && 
      mlflow server --backend-store-uri sqlite:////mlflow/mlruns.db 
      --default-artifact-root /mlflow/artifacts 
      --host 0.0.0.0 --port 5000"

  api-service:
    build: .
    ports:
      - "8000-8002:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    depends_on:
      - mlflow-server
    networks:
      - mlops_network
    deploy:
      replicas: 3

networks:
  mlops_network:
    driver: bridge

volumes:
  mlflow_data: